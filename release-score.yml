name: Release Score

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  release-score:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Calculate Score
        run: |
          python scripts/calculate_release_score.py release.json
